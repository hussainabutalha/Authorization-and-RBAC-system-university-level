  # These are examples matching local dev or generic placeholders.
  DATABASE_URL: "postgresql://postgres:password@db-host:5432/rbac_db"
  JWT_SECRET: "your_secret_key_here_change_in_production"
  # REDIS_URL: "redis://redis-host:6379/0" # Uncomment if using Redis
