<!-- Create Classroom Modal -->
<div id="create-classroom-modal"
    class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass w-full max-w-md rounded-xl p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold">Create Classroom</h3>
            <button onclick="closeCreateClassroomModal()" class="text-gray-400 hover:text-white">✕</button>
        </div>
        <form id="create-classroom-form" class="space-y-3">
            <input type="text" id="classroom-name" placeholder="Classroom Name" required
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:border-blue-500 outline-none">
            <textarea id="classroom-description" placeholder="Description (optional)" rows="3"
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:border-blue-500 outline-none resize-none"></textarea>
            <input type="number" id="classroom-max-students" placeholder="Max Students" value="50" min="1" required
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:border-blue-500 outline-none">
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg font-medium">Create
                Classroom</button>
        </form>
    </div>
</div>

<!-- Classroom Details Modal -->
<div id="classroom-details-modal"
    class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass w-full max-w-2xl rounded-xl p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold" id="classroom-detail-name">Classroom Name</h3>
            <button onclick="closeClassroomDetailsModal()" class="text-gray-400 hover:text-white">✕</button>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-700 mb-4">
            <button id="tab-stream" onclick="switchClassroomTab('stream')"
                class="px-4 py-2 text-sm text-blue-400 border-b-2 border-blue-400 font-medium">Stream</button>
            <button id="tab-classwork" onclick="switchClassroomTab('classwork')"
                class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200 font-medium">Classwork</button>
        </div>

        <!-- STREAM TAB -->
        <div id="view-stream" class="space-y-4">
            <div>
                <p class="text-sm text-gray-400">Description</p>
                <p id="classroom-detail-description" class="text-white">Description here</p>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="text-sm text-gray-400">Department</p>
                    <p id="classroom-detail-department" class="text-white">Department</p>
                </div>
                <div>
                    <p class="text-sm text-gray-400">Created By</p>
                    <p id="classroom-detail-creator" class="text-white">Creator</p>
                </div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <p class="text-sm text-gray-400">Members</p>
                    <div id="classroom-details-actions"></div>
                </div>
                <div id="classroom-members-list" class="space-y-2 max-h-40 overflow-y-auto">
                    <!-- Members will be loaded here -->
                </div>
            </div>

            <div class="border-t border-slate-700 pt-4 mt-4">
                <div class="flex justify-between items-center mb-2">
                    <p class="text-sm text-gray-400">Posts</p>
                    <button id="create-classroom-post-btn" onclick="showCreatePostForm()"
                        class="hidden text-xs bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded">
                        New Post
                    </button>
                </div>

                <div id="create-post-form-container" class="hidden mb-4 bg-slate-800/50 p-3 rounded">
                    <form onsubmit="createClassroomPost(event)" class="space-y-2">
                        <input type="text" id="post-title" placeholder="Title" required
                            class="w-full bg-slate-700 rounded px-3 py-1 text-sm outline-none">
                        <textarea id="post-content" placeholder="Share something with your class..." rows="2" required
                            class="w-full bg-slate-700 rounded px-3 py-1 text-sm outline-none resize-none"></textarea>
                        <div class="flex justify-end gap-2">
                            <button type="button" onclick="hideCreatePostForm()"
                                class="text-xs text-gray-400 hover:text-white">Cancel</button>
                            <button type="submit"
                                class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded">Post</button>
                        </div>
                    </form>
                </div>

                <div id="classroom-posts-list" class="space-y-3 max-h-64 overflow-y-auto">
                    <!-- Posts will be loaded here -->
                </div>
            </div>
        </div>

        <!-- CLASSWORK TAB -->
        <div id="view-classwork" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h4 class="font-semibold">Assignments</h4>
                <button id="create-assignment-btn" onclick="showCreateAssignmentForm()"
                    class="hidden text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded">
                    + Create Assignment
                </button>
            </div>

            <!-- Create Assignment Form -->
            <div id="create-assignment-form-container" class="hidden bg-slate-800/50 p-4 rounded">
                <h5 class="text-sm font-bold mb-2">New Assignment</h5>
                <form onsubmit="createAssignment(event)" class="space-y-3">
                    <input type="text" id="assign-title" placeholder="Title" required
                        class="w-full bg-slate-700 rounded px-3 py-1 text-sm outline-none">
                    <textarea id="assign-desc" placeholder="Instructions..." rows="2"
                        class="w-full bg-slate-700 rounded px-3 py-1 text-sm outline-none resize-none"></textarea>
                    <div class="flex gap-2">
                        <input type="date" id="assign-date"
                            class="bg-slate-700 rounded px-3 py-1 text-sm outline-none text-gray-300">
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" onclick="hideCreateAssignmentForm()"
                            class="text-xs text-gray-400 hover:text-white">Cancel</button>
                        <button type="submit"
                            class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded">Create</button>
                    </div>
                </form>
            </div>

            <!-- Assignment List -->
            <div id="assignments-list" class="space-y-3 max-h-[400px] overflow-y-auto">
                <div class="text-center text-gray-500 mt-4">Loading assignments...</div>
            </div>
        </div>

        <!-- SUBMISSION MODAL (Inside Details Modal for simplicity/overlay) -->
        <div id="submission-overlay"
            class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
            <div class="glass w-full max-w-lg rounded-xl p-6 bg-slate-900 border border-slate-700">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold" id="sub-overlay-title">Assignment</h3>
                    <button onclick="closeSubmissionOverlay()" class="text-gray-400 hover:text-white">✕</button>
                </div>

                <!-- Student View: Submit Work -->
                <div id="student-submission-view" class="hidden space-y-4">
                    <p id="sub-overlay-desc" class="text-sm text-gray-300">Instructions...</p>
                    <form onsubmit="submitWork(event)" class="space-y-3">
                        <textarea id="sub-text" placeholder="Type your answer here..." rows="4"
                            class="w-full bg-slate-800 rounded px-3 py-2 text-sm outline-none resize-none"></textarea>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Attach File</label>
                            <input type="file" id="sub-file" class="text-sm text-gray-300">
                        </div>
                        <button type="submit"
                            class="w-full bg-green-600 hover:bg-green-500 text-white py-2 rounded text-sm">Turn
                            In</button>
                    </form>
                </div>

                <!-- Instructor View: View Submissions -->
                <div id="instructor-submission-view" class="hidden space-y-4">
                    <div id="submissions-list" class="space-y-2 max-h-60 overflow-y-auto">
                        <!-- Submissions listed here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
